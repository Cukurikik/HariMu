name = "harimu-ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# PRODUKSI — `wrangler deploy` (tanpa --env)
# =============================================================================
# Secret TIDAK pernah ada di repo; isi lewat `wrangler secret put <NAMA>` (lihat README):
#   WAJIB    : INSTALL_TOKEN_SECRET, DOWNLOAD_SIGNING_SECRET
#   OPSIONAL : INSTALL_REGISTRATION_KEY (gerbang /v1/install)
#   TIDAK PERLU untuk fitur AI: model berjalan di Workers AI lewat binding `AI` (tanpa kunci).
#   OPSIONAL : REPLICATE_API_TOKEN + REPLICATE_VIDEO_VERSION (satu-satunya cara video live)
#
# Keputusan K6: TTS, gambar (generate/edit), vision, dan STT memakai Cloudflare Workers AI.
# Video generation tidak punya provider live Cloudflare; selama REPLICATE_* kosong,
# /v1/video-generate menjawab 501 provider_not_configured (bukan hasil palsu).

[vars]
# Default aman: "mock". Ubah ke "live" HANYA setelah secret terpasang (README langkah 6).
PROVIDER_MODE = "live"
RATE_LIMIT_PER_MIN = "30"
DAILY_QUOTA = "20"
MAX_UPLOAD_BYTES = "10485760"
TOKEN_TTL_SEC = "2592000"
INSTALL_RATE_PER_MIN = "10"
INSTALL_DAILY_PER_IP = "40"
VIDEO_JOB_TTL_SEC = "86400"
# WAJIB diisi sebelum produksi dibuka untuk pemanggil browser (bukan aplikasi Android, yang
# tidak mengirim Origin). Nilai "*" hanya boleh untuk pengembangan.
# ALLOWED_ORIGIN = "https://harimu.example"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "JOBS"
id = "4c27dc4fc22a4ea09bc6c857c273d6b6"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts"

[observability]
enabled = true

# =============================================================================
# DEV — `wrangler deploy --env dev` / `wrangler dev --env dev`
# Worker, KV, dan bucket terpisah supaya uji coba tidak mencampuri produksi.
# =============================================================================
[env.dev]
name = "harimu-ai-gateway-dev"

[env.dev.vars]
PROVIDER_MODE = "mock"
RATE_LIMIT_PER_MIN = "60"
DAILY_QUOTA = "50"

[env.dev.ai]
binding = "AI"

[[env.dev.kv_namespaces]]
binding = "JOBS"
id = "ab7d351195b54914beca9a1a0dcfeaee"

[[env.dev.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts-dev"
