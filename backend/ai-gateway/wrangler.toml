name = "harimu-ai-gateway"
main = "src/index.ts"
# Account ID Cloudflare (produksi). Digunakan wrangler untuk menentukan akasi target deploy.
account_id = "f42c984dced6af826814bc3cf0dd42da"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# PRODUKSI — `wrangler deploy` (tanpa --env)
# =============================================================================
# Secret TIDAK pernah ada di repo; isi lewat `wrangler secret put <NAMA>`:
#   WAJIB    : INSTALL_TOKEN_SECRET, DOWNLOAD_SIGNING_SECRET
#   OPSIONAL : INSTALL_REGISTRATION_KEY (gerbang /v1/install)
#   TIDAK PERLU untuk fitur AI: model berjalan di Workers AI lewat binding `AI` (gratis, tanpa kunci).
#   OPSIONAL : REPLICATE_API_TOKEN + REPLICATE_VIDEO_VERSION (hanya untuk video live)
#
# Model gratis yang dipakai (binding `AI`, tanpa kunci pihak ketiga):
#   TTS        @cf/deepgram/aura-1
#   Gambar     @cf/black-forest-labs/flux-1-schnell
#   Edit gambar @cf/runwayml/stable-diffusion-v1-5-img2img
#   Vision     @cf/meta/llama-3.2-11b-vision-instruct (butuh persetujuan lisensi Meta sekali)
#   STT        @cf/openai/whisper
# Video generation = 501 provider_not_configured selama REPLICATE_* kosong (sengaja, bukan palsu).

[vars]
# Default aman: "live" untuk produksi (harus setelah secret terpasang).
PROVIDER_MODE = "live"
RATE_LIMIT_PER_MIN = "30"
DAILY_QUOTA = "20"
MAX_UPLOAD_BYTES = "10485760"
TOKEN_TTL_SEC = "2592000"
INSTALL_RATE_PER_MIN = "10"
INSTALL_DAILY_PER_IP = "40"
VIDEO_JOB_TTL_SEC = "86400"
# Override model Workers AI gratis (kosongkan = pakai default di src/providers/cloudflare.ts).
CF_TTS_MODEL = "@cf/deepgram/aura-1"
CF_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
CF_IMAGE_EDIT_MODEL = "@cf/runwayml/stable-diffusion-v1-5-img2img"
CF_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
CF_ASR_MODEL = "@cf/openai/whisper"

# =============================================================================
# Provider eksternal OpenAI-compatible (fallback bila Cloudflare free tier habis).
# Base URL dan model default di [vars]; API key TIDAK ada di repo — isi lewat:
#   npx wrangler secret put <PROVIDER>_API_KEY
# Urutan di daftar ini menentukan prioritas fallback (dari atas ke bawah).
# =============================================================================

# 1. AION LABS
AION_BASE_URL = "https://api.aionlabs.ai/v1"
AION_MODEL = "aion-labs/aion-2.0"

# 2. Gonka Broker
GONKA_BASE_URL = "https://proxy.gonkabroker.com/v1"
GONKA_MODEL = "deepseek-ai/DeepSeek-V4-Flash-0731"

# 3. Groq
GROQ_BASE_URL = "https://api.groq.com/openai/v1"
GROQ_MODEL = "openai/gpt-oss-120b"

# 4. NVIDIA Models AI
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
NVIDIA_MODEL = "deepseek-ai/deepseek-v4.1-flash"

# 5. RunCreate
RUNCRATE_BASE_URL = "https://api.runcrate.ai/v1"
RUNCRATE_MODEL = "deepseek-ai/DeepSeek-V4.1-Flash"

# 6. Opencode
OPENCODE_BASE_URL = "https://opencode.ai/inference/openai/v1/chat/completions"
OPENCODE_MODEL = "deepseek-ai/DeepSeek-V4.1-Flash Free"

# 7. Agnes AI
AGNES_BASE_URL = "https://apihub.agnes-ai.com/v1"
AGNES_MODEL = "agnes-2.5-flash"

# 8. Requesty AI
REQUESTY_BASE_URL = "https://router.requesty.ai/v1"
REQUESTY_MODEL = "nemotron-3.5-lightning-30b-a3b"

# 9. AMD AI Models
AMD_BASE_URL = "https://api.tokenlab.amd.com/v1"
AMD_MODEL = "deepseek-ai/deepseek-v4-flash-0731"

# 10. Coarena
COARENA_BASE_URL = "https://coarena.ai/api/v1"
COARENA_MODEL = "deepseek-ai/deepseek-v4-flash-0731"

# 11. B.AI
BAI_BASE_URL = "https://api.b.ai/v1"
BAI_MODEL = "deepseek-v4-flash"

# 12. Inferx AI
INFERX_BASE_URL = "https://model.inferx.net/endpoints/v1"
INFERX_MODEL = "deepseek-v4-flash-0731"

# 13. Xkiro AI
XKIRO_BASE_URL = "https://api.xkiro.com/v1"
XKIRO_MODEL = "deepseek-v4-flash-0731"

# 14. Blueminds AI
BLUEMINDS_BASE_URL = "https://api.bluesminds.com/v1"
BLUEMINDS_MODEL = "deepseek-v4-flash-0731"

# 15. Servernusa
SERVERSUSA_BASE_URL = "https://ai.servernusa.com"
SERVERSUSA_MODEL = "nusa/deepseek-v4.1-flash-free"

# Batasi origin bila ada pemanggil browser (aplikasi Android tidak mengirim Origin).
# ALLOWED_ORIGIN = "https://harimu.example"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "JOBS"
# ID namespace hasil: `npx wrangler kv namespace create JOBS`
id = "f3d2d0a78789476ca53369d920759bf4"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts"

[observability]
enabled = true

# =============================================================================
# DEV — `wrangler dev --env dev` / `wrangler deploy --env dev`
# Worker, KV, dan bucket terpisah supaya uji coba tidak mencampuri produksi.
# =============================================================================
[env.dev]
name = "harimu-ai-gateway-dev"

[env.dev.vars]
PROVIDER_MODE = "mock"
RATE_LIMIT_PER_MIN = "60"
DAILY_QUOTA = "50"
MAX_UPLOAD_BYTES = "10485760"
TOKEN_TTL_SEC = "2592000"
INSTALL_RATE_PER_MIN = "10"
INSTALL_DAILY_PER_IP = "40"
VIDEO_JOB_TTL_SEC = "86400"

[env.dev.ai]
binding = "AI"

[[env.dev.kv_namespaces]]
binding = "JOBS"
id = "3257e5ffbb1f43b387e9276bd53a5d8c"

[[env.dev.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts-dev"
