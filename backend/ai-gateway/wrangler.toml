name = "harimu-ai-gateway"
main = "src/index.ts"
# Account ID Cloudflare (produksi). Digunakan wrangler untuk menentukan akasi target deploy.
account_id = "f42c984dced6af826814bc3cf0dd42da"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# PRODUKSI — `wrangler deploy` (tanpa --env)
# =============================================================================
# Secret TIDAK pernah ada di repo; isi lewat `wrangler secret put <NAMA>`:
#   WAJIB    : INSTALL_TOKEN_SECRET, DOWNLOAD_SIGNING_SECRET
#   OPSIONAL : INSTALL_REGISTRATION_KEY (gerbang /v1/install)
#   TIDAK PERLU untuk fitur AI: model berjalan di Workers AI lewat binding `AI` (gratis, tanpa kunci).
#   OPSIONAL : REPLICATE_API_TOKEN + REPLICATE_VIDEO_VERSION (hanya untuk video live)
#
# Model gratis yang dipakai (binding `AI`, tanpa kunci pihak ketiga):
#   TTS        @cf/deepgram/aura-1
#   Gambar     @cf/black-forest-labs/flux-1-schnell
#   Edit gambar @cf/runwayml/stable-diffusion-v1-5-img2img
#   Vision     @cf/meta/llama-3.2-11b-vision-instruct (butuh persetujuan lisensi Meta sekali)
#   STT        @cf/openai/whisper
# Video generation = 501 provider_not_configured selama REPLICATE_* kosong (sengaja, bukan palsu).

[vars]
# Default aman: "live" untuk produksi (harus setelah secret terpasang).
PROVIDER_MODE = "live"
RATE_LIMIT_PER_MIN = "30"
DAILY_QUOTA = "20"
MAX_UPLOAD_BYTES = "10485760"
TOKEN_TTL_SEC = "2592000"
INSTALL_RATE_PER_MIN = "10"
INSTALL_DAILY_PER_IP = "40"
VIDEO_JOB_TTL_SEC = "86400"
# Override model Workers AI gratis (kosongkan = pakai default di src/providers/cloudflare.ts).
CF_TTS_MODEL = "@cf/deepgram/aura-1"
CF_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
CF_IMAGE_EDIT_MODEL = "@cf/runwayml/stable-diffusion-v1-5-img2img"
CF_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
CF_ASR_MODEL = "@cf/openai/whisper"
# Batasi origin bila ada pemanggil browser (aplikasi Android tidak mengirim Origin).
# ALLOWED_ORIGIN = "https://harimu.example"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "JOBS"
# ID namespace hasil: `npx wrangler kv namespace create JOBS`
id = "f3d2d0a78789476ca53369d920759bf4"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts"

[observability]
enabled = true

# =============================================================================
# DEV — `wrangler dev --env dev` / `wrangler deploy --env dev`
# Worker, KV, dan bucket terpisah supaya uji coba tidak mencampuri produksi.
# =============================================================================
[env.dev]
name = "harimu-ai-gateway-dev"

[env.dev.vars]
PROVIDER_MODE = "mock"
RATE_LIMIT_PER_MIN = "60"
DAILY_QUOTA = "50"
MAX_UPLOAD_BYTES = "10485760"
TOKEN_TTL_SEC = "2592000"
INSTALL_RATE_PER_MIN = "10"
INSTALL_DAILY_PER_IP = "40"
VIDEO_JOB_TTL_SEC = "86400"

[env.dev.ai]
binding = "AI"

[[env.dev.kv_namespaces]]
binding = "JOBS"
id = "3257e5ffbb1f43b387e9276bd53a5d8c"

[[env.dev.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "harimu-ai-artifacts-dev"
