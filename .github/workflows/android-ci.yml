name: HariMu CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Actions di-pin ke commit SHA (immutable); tag hanya komentar informatif.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # AGP 9.1.1 mensyaratkan Gradle >= 9.3.1 (developer.android.com/build/releases/about-agp),
      # jadi CI memakai Gradle terpasang; repo ini belum menyertakan gradlew/wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.3.1'

      - name: Check ktlint formatting
        run: |
          set -euo pipefail
          KTLINT_VERSION=1.5.0
          BASE="https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/${KTLINT_VERSION}"
          curl -fsSL -o ktlint-cli.jar "${BASE}/ktlint-cli-${KTLINT_VERSION}-all.jar"
          curl -fsSL -o ktlint-cli.jar.sha1 "${BASE}/ktlint-cli-${KTLINT_VERSION}-all.jar.sha1"
          echo "$(cat ktlint-cli.jar.sha1)  ktlint-cli.jar" | sha1sum -c -
          java -jar ktlint-cli.jar "app/src/**/*.kt"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android Lint
        run: gradle lintDebug

      - name: Build release APK (R8, unsigned unless secrets are set)
        run: gradle assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  backend:
    name: AI gateway tests & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/ai-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/ai-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Worker tests
        run: npm test

  # Opsional: tes instrumented di emulator. Gagal di sini TIDAK menggagalkan workflow.
  # TODO(pemilik): tambahkan dependency androidTest sebelum job ini bisa lulus:
  #   androidTestImplementation(libs.androidx.test.ext.junit)
  #   androidTestImplementation(libs.androidx.test.core)
  #   androidTestImplementation("androidx.test:runner:<versi>")
  #   androidTestImplementation("androidx.test:rules:<versi>")
  # Versi harus disamakan dengan katalog; jangan dinaikkan tanpa verifikasi build.
  instrumented:
    name: Instrumented tests (emulator, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.3.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected androidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
